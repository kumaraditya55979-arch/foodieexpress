      - name: Write key.properties
        run: |
          cat > delivery_app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Delivery APK
        working-directory: delivery_app
        run: flutter pub get && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: 2-Delivery-Boy-App-Signed
          path: delivery_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── ADMIN APP ───────────────────────────────────────────────────────────────
  build-admin:
    runs-on: ubuntu-latest
