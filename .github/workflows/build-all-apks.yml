          storeFile=keystore.jks
          EOF

      - name: Build Admin APK
        working-directory: admin_app
        run: flutter pub get && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: 3-Admin-App-Signed
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
