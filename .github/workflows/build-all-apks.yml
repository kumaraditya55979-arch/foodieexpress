name: Build & Sign All 3 APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── CUSTOMER APP ────────────────────────────────────────────────────────────
  build-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > customer_app/android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > customer_app/android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > customer_app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Customer APK
        working-directory: customer_app
        run: flutter pub get && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: 1-Customer-App-Signed
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── DELIVERY BOY APP ────────────────────────────────────────────────────────
  build-delivery:
    runs-on: ubuntu-latest
    steps:
