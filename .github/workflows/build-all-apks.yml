      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON_ADMIN }}' > admin_app/android/app/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > admin_app/android/app/keystore.jks

      - name: Write key.properties
        run: |
          cat > admin_app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
