name: food_delivery_customer
description: Zomato-style food delivery customer app
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  mappls_gl: ^1.0.4
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^4.2.1
  intl: ^0.19.0
  url_launcher: ^6.2.6
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3
  pinput: ^5.0.0
  google_sign_in: ^6.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/mappls/
    - assets/images/
    - assets/animations/
    - assets/fonts/
